<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        .slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        body {
            background-color: #F8FAFC;
            overscroll-behavior-y: contain;
        }
    </style>

<div class="fixed bottom-[-10%] left-1/2 -translate-x-1/2 w-[150%] h-[30%] bg-secondary/5 blur-[100px] rounded-full pointer-events-none"></div>
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('opacity-80');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('opacity-80');
            });
        });

        // Simple check for safe-area insets (modern mobile browsers)
        if (window.CSS && CSS.supports('padding-bottom: env(safe-area-inset-bottom)')) {
            document.body.style.paddingBottom = 'env(safe-area-inset-bottom)';
            document.body.style.paddingTop = 'env(safe-area-inset-top)';
        }
    </script>
